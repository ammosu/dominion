[package]
name = "dominion-wasm"
version = "0.1.0"
edition = "2021"
description = "Dominion engine and AI for the browser (GitHub Pages build)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "../shared" }
serde_json = "1"
wasm-bindgen = "0.2"
# rand needs a browser entropy source on wasm32.
getrandom = { version = "0.3", features = ["wasm_js"] }
