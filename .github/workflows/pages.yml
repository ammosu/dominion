# Static build for GitHub Pages: the Rust engine runs in the browser as
# WebAssembly (crates/wasm), so no game server is needed.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test engine
        run: cargo test

      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          sudo mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/

      - name: Build engine for the browser
        run: wasm-pack build crates/wasm --release --target web --no-pack --out-dir "$GITHUB_WORKSPACE/frontend-new/src/wasm"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install, test and build frontend
        working-directory: frontend-new
        env:
          VITE_ENGINE: wasm
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend-new/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
