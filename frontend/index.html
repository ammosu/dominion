<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby">
    <div id="lobby-box">
      <h1>Dominion</h1>
      <div id="player-inputs">
        <input type="text" class="player-name-input" placeholder="Player 1 name" value="Alice">
        <input type="text" class="player-name-input" placeholder="Player 2 name" value="Bob">
      </div>
      <button id="start-game-btn">Start Game</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="app" class="hidden">
    <header id="turn-info">
      <span id="current-player"></span>
      <span id="phase-badge"></span>
      <div id="counters">
        <span id="actions-counter" class="counter">Actions: 0</span>
        <span id="buys-counter" class="counter">Buys: 0</span>
        <span id="coins-counter" class="counter">Coins: 0</span>
      </div>
      <div id="phase-buttons"></div>
    </header>

    <main id="board">
      <section id="supply">
        <h2>Supply</h2>
        <div id="supply-grid"></div>
      </section>

      <div id="right-panel">
        <aside id="players-sidebar">
          <h2>Players</h2>
          <div id="players-list"></div>
        </aside>

        <aside id="action-log">
          <h2>Log</h2>
          <div id="log-entries"></div>
        </aside>
      </div>
    </main>

    <footer id="hand-area">
      <div id="hand-header">
        <h2>Your Hand</h2>
        <div id="hand-buttons"></div>
      </div>
      <div id="hand"></div>
    </footer>
  </div>

  <!-- Game Over Overlay -->
  <div id="game-over" class="hidden">
    <div id="game-over-box">
      <h1>Game Over</h1>
      <div id="final-scores"></div>
      <button id="new-game-btn">New Game</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
