<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby">
    <div id="lobby-box">
      <h1>Dominion</h1>
      <button id="rules-btn-lobby" class="secondary rules-btn">📖 <span class="rules-btn-text">Game Rules</span></button>
      <div id="player-inputs">
        <div class="player-input-row">
          <input type="text" class="player-name-input" placeholder="Player 1 name" value="Alice">
          <label class="ai-toggle">
            <input type="checkbox" class="ai-checkbox">
            <span class="ai-label">AI</span>
          </label>
        </div>
        <div class="player-input-row">
          <input type="text" class="player-name-input" placeholder="Player 2 name" value="Bot">
          <label class="ai-toggle">
            <input type="checkbox" class="ai-checkbox" checked>
            <span class="ai-label">AI</span>
          </label>
        </div>
      </div>
      <button id="start-game-btn">Start Game</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="app" class="hidden">
    <header id="turn-info">
      <span id="current-player"></span>
      <span id="phase-badge"></span>
      <div id="counters">
        <span id="actions-counter" class="counter">Actions: 0</span>
        <span id="buys-counter" class="counter">Buys: 0</span>
        <span id="coins-counter" class="counter">Coins: 0</span>
      </div>
      <span id="phase-hint" class="phase-hint hidden"></span>
      <div id="phase-buttons"></div>
    </header>

    <main id="board">
      <section id="supply">
        <h2>Supply</h2>
        <div id="supply-grid"></div>
      </section>

      <div id="right-panel">
        <aside id="players-sidebar">
          <h2>Players</h2>
          <div id="players-list"></div>
        </aside>

        <aside id="action-log">
          <h2>Log</h2>
          <div id="log-entries"></div>
        </aside>
      </div>
    </main>

    <footer id="hand-area">
      <div id="hand-header">
        <h2>Your Hand</h2>
        <div id="hand-buttons"></div>
      </div>
      <div id="hand"></div>
    </footer>
  </div>

  <!-- Game Over Overlay -->
  <div id="game-over" class="hidden">
    <div id="game-over-box">
      <h1>Game Over</h1>
      <div id="final-scores"></div>
      <button id="new-game-btn">New Game</button>
    </div>
  </div>

  <!-- Rules Modal -->
  <div id="rules-modal" class="hidden">
    <div class="modal-overlay" onclick="closeRulesModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="rules-title">How to Play Dominion</h2>
        <button class="modal-close" onclick="closeRulesModal()">✕</button>
      </div>
      <div id="rules-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Confirm Purchase Modal -->
  <div id="confirm-modal" class="hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content confirm-modal-content">
      <div class="modal-header">
        <h2 id="confirm-title"></h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button id="confirm-cancel" class="secondary"></button>
        <button id="confirm-ok" class="success"></button>
      </div>
    </div>
  </div>

  <!-- Card Tooltip -->
  <div id="card-tooltip" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
